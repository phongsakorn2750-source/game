<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Potato Panic Deluxe</title>
  <style>
    :root {
      --bg1: #ffef9e;
      --bg2: #ffd0db;
      --bg3: #d9f7ff;
      --card: #fffdf5;
      --ink: #2f1d3a;
      --grass: #9ae6b4;
      --pink: #ff6d8a;
      --blue: #5bc0ff;
      --purple: #8b5cf6;
      --yellow: #ffd166;
      --green: #6ee7b7;
      --shadow: #2f1d3a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Comic Sans MS", "Trebuchet MS", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.8), transparent 20%),
        linear-gradient(180deg, var(--bg1), var(--bg2) 38%, var(--bg3));
      color: var(--ink);
    }

    body {
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .game {
      width: min(760px, 100%);
      background: rgba(255, 255, 255, 0.6);
      border: 5px solid var(--shadow);
      border-radius: 34px;
      box-shadow: 12px 12px 0 var(--shadow);
      padding: 24px 20px 18px;
      position: relative;
      overflow: hidden;
    }

    .game::before,
    .game::after {
      content: "";
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      z-index: 0;
    }

    .game::before { top: -42px; left: -48px; }
    .game::after { right: -40px; bottom: -44px; }

    .inner {
      position: relative;
      z-index: 1;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(2.2rem, 7vw, 4.7rem);
      line-height: 0.9;
      letter-spacing: 0.04em;
      transform: rotate(-3deg);
      text-shadow: 4px 4px 0 var(--yellow);
    }

    .subtitle {
      text-align: center;
      margin: 10px 0 18px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #4f355a;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .stat {
      min-width: 120px;
      padding: 10px 14px;
      border: 3px solid var(--shadow);
      border-radius: 18px;
      background: var(--card);
      text-align: center;
      font-weight: 800;
      box-shadow: 4px 4px 0 rgba(47,29,58,0.14);
    }

    .stat .label {
      display: block;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.8;
    }

    .stat .value {
      display: block;
      font-size: clamp(1.4rem, 3vw, 2.1rem);
      margin-top: 5px;
    }

    .arena {
      position: relative;
      height: 340px;
      background:
        linear-gradient(to bottom, #d8f5ff 0%, #d8f5ff 65%, var(--grass) 65%, var(--grass) 100%);
      border: 4px dashed var(--shadow);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: inset 0 -12px 0 rgba(0,0,0,0.08);
    }

    .sun {
      position: absolute;
      top: 22px;
      right: 28px;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: #ffe66d;
      border: 4px solid var(--shadow);
    }

    .cloud {
      position: absolute;
      width: 110px;
      height: 36px;
      border-radius: 999px;
      background: rgba(255,255,255,0.8);
      border: 3px solid var(--shadow);
      top: 24px;
      left: 22px;
      opacity: 0.8;
    }

    .cloud::before, .cloud::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.8);
      border: 3px solid var(--shadow);
      border-radius: 50%;
    }

    .cloud::before {
      width: 36px;
      height: 36px;
      left: 16px;
      top: -18px;
    }

    .cloud::after {
      width: 48px;
      height: 48px;
      right: 20px;
      top: -24px;
    }

    .cloud.two {
      left: auto;
      right: 120px;
      top: 70px;
      transform: scale(0.9);
    }

    .potato {
      position: absolute;
      display: none;
      width: 90px;
      height: 90px;
      border: 0;
      background: transparent;
      font-size: 4.2rem;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      filter: drop-shadow(4px 5px 0 rgba(80,44,24,0.85));
      transition: transform 0.08s ease;
      animation: wobble 0.38s ease-in-out infinite alternate;
    }

    .potato.visible { display: block; }
    .potato:active { transform: scale(0.88); }

    .potato.bonked {
      animation: pop 0.22s ease forwards;
    }

    @keyframes wobble {
      from { transform: rotate(-16deg) scale(1); }
      to { transform: rotate(14deg) scale(1.05); }
    }

    @keyframes pop {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    .controls {
      display: flex;
      justify-content: center;
      margin-top: 18px;
    }

    button.start {
      border: 4px solid var(--shadow);
      background: linear-gradient(180deg, #ff7d90, #ff4f73);
      color: white;
      font: inherit;
      font-size: 1.2rem;
      font-weight: 900;
      padding: 14px 22px;
      border-radius: 18px;
      box-shadow: 6px 6px 0 var(--shadow);
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    button.start:active {
      transform: translate(4px, 4px);
      box-shadow: 2px 2px 0 var(--shadow);
    }

    button.start:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    .message {
      min-height: 1.5em;
      margin: 16px 0 0;
      text-align: center;
      font-size: 1rem;
      font-weight: 800;
      color: #443b5e;
    }

    .hint {
      margin-top: 8px;
      text-align: center;
      color: #5a3e70;
      font-size: 0.9rem;
      font-weight: 700;
    }

    @media (max-width: 540px) {
      .game { padding: 18px 14px 16px; }
      .arena { height: 290px; }
      .potato { width: 76px; height: 76px; font-size: 3.6rem; }
      .stat { min-width: 100px; }
    }
  </style>
</head>
<body>
  <main class="game">
    <div class="inner">
      <h1>🥔 POTATO<br />PANIC!</h1>
      <div class="subtitle">The potato is angry. The potato is also ridiculous.</div>

      <div class="stats" aria-label="Game stats">
        <div class="stat">
          <span class="label">Bonks</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="stat">
          <span class="label">Time</span>
          <span class="value" id="time">15</span>
        </div>
        <div class="stat">
          <span class="label">Mood</span>
          <span class="value" id="mood">OKAY</span>
        </div>
      </div>

      <div class="arena" id="arena" aria-label="Potato arena">
        <div class="sun" aria-hidden="true"></div>
        <div class="cloud" aria-hidden="true"></div>
        <div class="cloud two" aria-hidden="true"></div>
        <button class="potato" id="potato" type="button" aria-label="Bonk the potato">🥔</button>
      </div>

      <div class="controls">
        <button class="start" id="startBtn" type="button">START THE ABSURDITY</button>
      </div>

      <div class="message" id="message" role="status">Tap the button. Bonk the potato. Save the dignity of all spuds.</div>
      <div class="hint">You have 15 seconds. Zero skill. Full chaos.</div>
    </div>
  </main>

  <script>
    const arena = document.getElementById('arena');
    const potato = document.getElementById('potato');
    const message = document.getElementById('message');
    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');
    const moodEl = document.getElementById('mood');
    const startBtn = document.getElementById('startBtn');

    let score = 0;
    let timeLeft = 15;
    let timer = null;
    let gameRunning = false;
    let audioCtx = null;

    const messages = [
      'BONK! A tiny potato legend is born.',
      'That was deliciously rude.',
      'The potato has entered its dramatic phase.',
      'A perfect bonk. The spud is deeply offended.',
      'You are now certified in potato abuse.',
      'That hit the weak spot: the potato soul.',
      'The crowd is silent. The crowd is imaginary.',
      'Excellent. The potato is absolutely furious.'
    ];

    function ensureAudio() {
      if (!audioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) audioCtx = new AudioCtx();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    function beep(freq, duration, volume = 0.05, type = 'square') {
      if (!audioCtx) return;
      const oscillator = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      oscillator.type = type;
      oscillator.frequency.value = freq;
      gain.gain.value = volume;
      oscillator.connect(gain);
      gain.connect(audioCtx.destination);
      oscillator.start();
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      oscillator.stop(audioCtx.currentTime + duration);
    }

    function randomPotatoPosition() {
      const padding = 40;
      const marginX = arena.clientWidth - 100;
      const marginY = arena.clientHeight - 100;
      const x = padding + Math.random() * Math.max(0, marginX - padding);
      const y = padding + Math.random() * Math.max(0, marginY - padding);
      potato.style.left = `${x}px`;
      potato.style.top = `${y}px`;
    }

    function showPotato() {
      potato.classList.add('visible');
      randomPotatoPosition();
    }

    function hidePotato() {
      potato.classList.remove('visible');
      potato.classList.remove('bonked');
    }

    function updateMood() {
      if (score >= 18) moodEl.textContent = 'GOD';
      else if (score >= 10) moodEl.textContent = 'WILD';
      else if (score >= 5) moodEl.textContent = 'SPUDDY';
      else moodEl.textContent = 'OKAY';
    }

    function finishGame() {
      gameRunning = false;
      clearInterval(timer);
      hidePotato();
      startBtn.disabled = false;
      startBtn.textContent = 'PLAY AGAIN, DUMBO';
      const result = score >= 12 ? 'You are officially a potato wizard.' : 'You are definitely weird, and the potato knows it.';
      message.textContent = `Time's up! You bonked ${score} potato${score === 1 ? '' : 'es'}. ${result}`;
      moodEl.textContent = score >= 15 ? 'LEGEND' : 'WEIRD';
      beep(220, 0.18, 0.06, 'sawtooth');
      setTimeout(() => beep(160, 0.24, 0.06, 'triangle'), 120);
    }

    function startGame() {
      ensureAudio();
      score = 0;
      timeLeft = 15;
      scoreEl.textContent = score;
      timeEl.textContent = timeLeft;
      moodEl.textContent = 'GO!!!';
      gameRunning = true;
      startBtn.disabled = true;
      startBtn.textContent = 'BONKING...';
      message.textContent = 'GO! BONK THE SPUD BEFORE IT GETS IDEAS!';
      showPotato();

      clearInterval(timer);
      timer = setInterval(() => {
        timeLeft -= 1;
        timeEl.textContent = timeLeft;
        if (timeLeft <= 0) {
          finishGame();
        }
      }, 1000);
    }

    potato.addEventListener('click', () => {
      if (!gameRunning) return;

      score += 1;
      scoreEl.textContent = score;
      updateMood();
      message.textContent = messages[Math.floor(Math.random() * messages.length)];
      potato.classList.add('bonked');
      beep(480 + score * 18, 0.08, 0.06, 'square');
      setTimeout(() => {
        potato.classList.remove('bonked');
        showPotato();
      }, 90);
    });

    startBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
